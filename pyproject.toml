[project]
name = "enquete"
version = "0.1.0"
description = "アンケート読み込み支援アプリ(3ペイン: サムネイル / PDF表示 / 入力結果)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "ocrmac>=1.0.1 ; sys_platform == 'darwin'",
    "opencv-python-headless>=4.13.0.92",
    "pypdfium2>=5.8.0",
    "PySide6>=6.8",
]

[project.optional-dependencies]
# Windows/Linux 向け OCR バックエンド(Chrome screen-ai)。
# locro はソース配布(PyPI 未公開)で、エンジン本体/モデルは非再配布のため
# 導入後に `locro download` で手元の Chrome からコピーする必要がある。
# 詳細は docs/ocr_windows.md を参照。
screenai = [
    "locro @ git+https://github.com/sergiocorreia/clv-locro",
    "pillow>=10",
]
# Windows 標準OCR(Windows.Media.Ocr)バックエンド。winsdk(WinRT射影)を使用。
# Windows でのみ意味を持つ(他OSでは導入不要)。再配布の問題なし(OS標準OCR)。
winocr = [
    "winsdk ; sys_platform == 'win32'",
]
# スタンドアロンバイナリのビルド(PyInstaller)。enquete.spec を使用。
build = [
    "pyinstaller>=6.6",
]

# locro を Git 直接参照(direct reference)で指定するため許可フラグが必要。
[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enquete"]

[tool.uv]
package = true

[tool.pyright]
# src-layout: 解析時に src/ をインポートパスへ追加
extraPaths = ["src"]

name: Build binaries

# 手動実行(workflow_dispatch)と、v* タグ push 時にビルド。
# タグ push のときは生成物を GitHub Release に添付する。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # タグ時に Release へ添付するため

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: enquete-macos.zip
            patch_asset: enquete-patch-macos.zip
          - os: windows-latest
            asset: enquete-windows.exe
            patch_asset: enquete-patch-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create venv (Python 3.12)
        run: uv venv --python 3.12

      # 依存をインストール(lock 非依存・pyproject から直接解決)。
      # macOS は ocrmac(Apple Vision)が base 依存に含まれる。
      # Windows は winocr extra(Windows 標準 OCR)も入れる。
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          uv pip install -e .
          uv pip install pyinstaller

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          uv pip install -e ".[winocr]"
          uv pip install pyinstaller

      # screen-ai ラッパ(locro・MIT)を同梱用に導入。AGPL の PyMuPDF を
      # 引かないよう --no-deps(実行時に必要なのは PIL のみ=base 済み)。
      - name: Install locro (no deps, for screen-ai bundling)
        run: uv pip install --no-deps "git+https://github.com/sergiocorreia/clv-locro"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/pyinstaller enquete.spec --noconfirm

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\pyinstaller.exe enquete.spec --noconfirm

      # macOS: .app を ditto で zip 化(リソースフォーク保持)。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/enquete.app" "enquete-macos.zip"

      # Windows: onefile の単一 exe をそのまま配布名にリネーム。
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "dist/enquete.exe" "enquete-windows.exe"

      # 年齢・性別 複数選択化パッチ(ドラッグ&ドロップGUI・単体配布)。
      - name: Build patch tool (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/pyinstaller enquete_patch.spec --noconfirm

      - name: Build patch tool (Windows)
        if: runner.os == 'Windows'
        run: .venv\Scripts\pyinstaller.exe enquete_patch.spec --noconfirm

      - name: Package patch tool (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/enquete-patch.app" "enquete-patch-macos.zip"

      - name: Package patch tool (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item "dist/enquete-patch.exe" "enquete-patch-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.patch_asset }}
          path: ${{ matrix.patch_asset }}
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.patch_asset }}
